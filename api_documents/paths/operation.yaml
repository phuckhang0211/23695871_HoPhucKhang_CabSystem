admin~1trips~1{tripId}:
  patch:
    tags:
      - Operation
    summary: Điều chỉnh nghiệp vụ chuyến xe
    operationId: updateAdminTrip
    x-fr:
      - FR23
      - FR24

    security:
      - bearerAuth: []

    parameters:
      - $ref: "../parameters.yaml#/TripId"

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/trip.yaml#/AdminUpdateTripRequest"

    responses:
      "200":
        description: Cập nhật thành công
        content:
          application/json:
            schema:
              $ref: "../schemas/trip.yaml#/Trip"

      "400":
        $ref: "../responses.yaml#/BadRequest"

      "401":
        $ref: "../responses.yaml#/Unauthorized"

      "403":
        $ref: "../responses.yaml#/Forbidden"

      "404":
        $ref: "../responses.yaml#/NotFound"
