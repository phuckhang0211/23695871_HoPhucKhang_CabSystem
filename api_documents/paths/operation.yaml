admin~1trips:
  get:
    tags:
      - Operation
    summary: Theo dõi và điều phối chuyến xe
    operationId: getAdminTrips
    x-fr:
      - FR23

    security:
      - bearerAuth: []

    parameters:
      - $ref: "../parameters.yaml#/Page"
      - $ref: "../parameters.yaml#/Limit"

    responses:
      "200":
        description: Danh sách chuyến xe
        content:
          application/json:
            schema:
              $ref: "../schemas/trip.yaml#/TripListResponse"

      "401":
        $ref: "../responses.yaml#/Unauthorized"

      "403":
