register:
  post:
    tags:
      - Auth

    summary: Đăng ký tài khoản

    description: |
      Đăng ký tài khoản người dùng mới.

    operationId: registerUser

    x-fr:
      - FR01

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/RegisterRequest"

    responses:
      "201":
        description: Đăng ký thành công

        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/RegisterResponse"

      "400":
        $ref: "../responses.yaml#/BadRequest"

      "409":
        $ref: "../responses.yaml#/Conflict"

      "500":
        $ref: "../responses.yaml#/InternalServerError"

login:
  post:
    tags:
      - Auth

    summary: Đăng nhập

    description: |
      Xác thực tài khoản và cấp access token.

    operationId: loginUser

    x-fr:
      - FR02

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/LoginRequest"

    responses:
      "200":
        description: Đăng nhập thành công

        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/LoginResponse"

      "400":
        $ref: "../responses.yaml#/BadRequest"

      "401":
        $ref: "../responses.yaml#/Unauthorized"

      "500":
        $ref: "../responses.yaml#/InternalServerError"

logout:
  post:
    tags:
      - Auth

    summary: Đăng xuất

    operationId: logoutUser

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Đăng xuất thành công

        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/SuccessResponse"

      "401":
        $ref: "../responses.yaml#/Unauthorized"

      "500":
        $ref: "../responses.yaml#/InternalServerError"
