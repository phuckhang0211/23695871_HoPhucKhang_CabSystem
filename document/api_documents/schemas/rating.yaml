Rating:
  type: object
  required:
    - id
    - tripId
    - score
  properties:
    id:
      type: string
      format: uuid
    tripId:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    score:
      type: integer
      minimum: 1
      maximum: 5
    comment:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time

CreateRatingRequest:
  type: object
  required:
    - score
  properties:
    score:
      type: integer
      minimum: 1
      maximum: 5
    comment:
      type: string
