services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: cab
      POSTGRES_PASSWORD: cab
    volumes:
      - auth-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  auth-service:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://cab:cab@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      PROFILE_FLEET_SERVICE_URL: http://profile-fleet-service:3007
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
    depends_on:
      - auth-db
volumes:
  auth-data:
