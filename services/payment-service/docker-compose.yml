services:
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: cab
      POSTGRES_PASSWORD: cab
    volumes:
      - payment-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgres://cab:cab@payment-db:5432/payment
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:3009
    depends_on:
      - payment-db
volumes:
  payment-data:
