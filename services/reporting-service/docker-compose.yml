services:
  reporting-db:
    image: postgres:16-alpine
    environment:
      { POSTGRES_DB: reporting, POSTGRES_USER: cab, POSTGRES_PASSWORD: cab }
    volumes:
      [
        "reporting-data:/var/lib/postgresql/data",
        "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro",
      ]
  reporting-service:
    build: .
    ports: ["3012:3012"]
    environment:
      {
        PORT: 3012,
        DATABASE_URL: postgres://cab:cab@reporting-db:5432/reporting,
      }
    depends_on: [reporting-db]
volumes:
  reporting-data:
